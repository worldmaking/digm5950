  <body>
    <div class="container">
    <canvas id="gl" width="960" height="540"></canvas>
    <p id="title" class="roboto100"></p>
    </div>
<script>
const width = 3840
const height = 1920
const totalFrames = 90
const DEFAULT_SERVER = "http://localhost:3000"

async function startCapture({
  canvas, gl, renderFrame, totalFrames,
  name="capture", 
  fps=30,
  serverURL = DEFAULT_SERVER,
  onProgress = null, onComplete = null, onError = null
}) {
  const { width, height } = canvas
  const bytesPerFrame = width * height * 4 // RGBA

  // reusable read buffer
  const pixelBuffer = new Uint8Array(bytesPerFrame)

  console.log(`start capture ${name} ${width}x${height} for ${totalFrames} frames`)

  return new Promise((resolve, reject)=>{
    const ws = new WebSocket(serverURL)
    ws.binaryType = "arraybuffer"

    ws.onopen = async()=> {
      // first send config
      ws.send(JSON.stringify({
        name, width, height, fps, totalFrames
      }))

      // stream frames
      try {
        for (let i=0; i<totalFrames; i++) {
          console.log("start frame", i)
          // render image & pull to cpu
          renderFrame(i)
          gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuffer)

          // wait for socket
          await waitForDrain(ws)

          // send a copy, so we can re-use the buffer
          ws.send(pixelBuffer.slice(0))
          onProgress?.(i)
        }
        // done
        ws.close()
      } catch(err) {
        ws.close()
        console.error(err)
        reject(err)
      }
    }

    // final message is result
    ws.onmessage = (e) => {
      const result = JSON.parse(e.data)
      console.log(result)
      onComplete?.(result)
      resolve(result)
    }

    ws.onError = (e) => {
      onError?.(e)
      reject(e)
    }
  })
}

function waitForDrain(ws) {
  return new Promise((resolve) => {
    const check = () => {
      if (ws.bufferedAmount < 64*1024*1024) {
        resolve()
      } else {
        setTimeout(check, 10)
      }
    }
    check()
  })
}


const canvas = document.getElementById('gl');
canvas.width = width
canvas.height = height

const gl = canvas.getContext("webgl2");


function renderFrame(frame) {

}

startCapture({
  canvas, gl, renderFrame, totalFrames
})

</script>
